const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),today=()=>new Date().toISOString().slice(0,10),fmt=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
function stageLabel(id){return(STAGES.find(x=>x[0]===id)||[id,id])[1]}

function startForRange(){const now=new Date(),v=$('range').value;let d=new Date(now);if(v==='all')return null;if(v==='week'){const day=(now.getDay()+6)%7;d.setDate(now.getDate()-day);d.setHours(0,0,0,0)}else if(v==='month')d=new Date(now.getFullYear(),now.getMonth(),1);else if(v==='30'){d.setDate(now.getDate()-29);d.setHours(0,0,0,0)}else if(v==='quarter')d=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1);else d=new Date(now.getFullYear(),0,1);return d}
function inRange(d){if(!d)return false;const st=startForRange();return!st||new Date(d)>=st}
function currentOrEventCount(stage){const ids=new Set(events.filter(e=>e.to===stage&&inRange(e.at)).map(e=>String(e.submission_id)));subs.filter(s=>s.stage===stage&&inRange(subDate(s))).forEach(s=>ids.add(String(s.id)));return ids.size}
function interviewCount(){const ids=new Set(events.filter(e=>['interview_pm','interview_client'].includes(e.to)&&inRange(e.at)).map(e=>String(e.submission_id)));subs.filter(s=>['interview_pm','interview_client'].includes(s.stage)&&inRange(subDate(s))).forEach(s=>ids.add(String(s.id)));return ids.size}

 $('statusline').textContent='Syncing…';
 const [{data:r,error:er},{data:s,error:es},{data:n}]=await Promise.all([sb.from('reqs').select('*').order('id',{ascending:false}),sb.from('submissions').select('*').order('created_at',{ascending:false}),sb.from('candidate_notes').select('*').order('created_at',{ascending:false})]);
 if(er||es){$('content').innerHTML=`<div class="card"><b>Database error</b><div class="small">${esc((er||es).message)}</div></div>`;return}
 reqs=r||[];subs=s||[];events=(n||[]).map(x=>{const m=String(x.note||'').match(/^STAGE_EVENT\|([^|]*)\|([^|]*)\|(.+)$/);return m?{submission_id:x.submission_id,from:m[1],to:m[2],at:m[3]}:null}).filter(Boolean);
 const {data:jd}=await sb.from('job_descriptions').select('*').order('id',{ascending:false});jds=jd||[];
 $('statusline').textContent=`Connected · ${reqs.length} reqs · ${subs.length} submissions`;render();
}
function render(){killCharts();if(page==='dashboard')drawDashboard();else if(page==='reqs')drawReqs();else if(page==='pipeline')drawPipeline();else if(page==='jds')drawJDs();else if(page==='clients')drawClients();else if(page==='team')drawTeam()}
function setTop(title,button,fn){$('pagetitle').textContent=title;$('addbtn').textContent=button;$('addbtn').onclick=fn}
function drawDashboard(){
 setTop('Recruiting Dashboard','+ Add Req',()=>openReqModal());const periodReqs=reqs.filter(r=>r.role!=='— placeholder —'&&inRange(reqDate(r))),ss=subs.filter(s=>inRange(subDate(s))),iv=interviewCount(),os=currentOrEventCount('offer_signed'),pl=currentOrEventCount('placed'),ar=activeReqs(),seats=ar.reduce((a,r)=>a+(+r.seats||1),0);const funnel=[['Submitted',ss.length],['Interview',iv],['Offer',currentOrEventCount('offer')],['Signed',os],['Placed',pl]];const attention=ar.map(r=>{const list=reqSubs(r);if(!list.length)return{r,msg:'No submissions',red:true};const last=Math.max(...list.map(x=>new Date(subDate(x)).getTime()).filter(Boolean));const days=Math.floor((Date.now()-last)/86400000);if(days>=7)return{r,msg:`No submission activity in ${days} days`};if(!list.some(s=>!['pass','declined','placed'].includes(s.stage)))return{r,msg:'No candidates currently in play'};return null}).filter(Boolean).slice(0,8);
 $('content').innerHTML=`<div class="grid kpis">${[['Positions Added',periodReqs.length],['Candidates Submitted',ss.length],['Interviews',iv],['Signed Offers',os],['Placements',pl],['Active Reqs',ar.length],['Open Seats',seats],['Submit → Placement',ss.length?Math.round(pl/ss.length*100)+'%':'0%']].map(x=>`<div class="card"><div class="klabel">${x[0]}</div><div class="kvalue">${x[1]}</div></div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="section">Recruiting Funnel</div><div class="funnel">${funnel.map(x=>`<div class="fstep"><div class="fnum">${x[1]}</div><div class="flbl">${x[0]}</div></div>`).join('')}</div></div><div class="grid two"><div class="card"><div class="section">12-Week Activity Trend</div><div class="chartbox"><canvas id="trend"></canvas></div></div><div class="card"><div class="section">Needs Attention</div><div class="attention">${attention.length?attention.map(a=>`<div class="att ${a.red?'redb':''}"><b>${esc(a.r.client)} — ${esc(a.r.role)}</b><div class="small">${esc(a.msg)}</div></div>`).join(''):'<div class="small">No urgent reqs flagged.</div>'}</div></div></div>`;drawTrend();
}
function weekStart(d){const x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function drawTrend(){const weeks=[],labels=[],cur=weekStart(new Date());for(let i=11;i>=0;i--){const d=new Date(cur);d.setDate(cur.getDate()-i*7);weeks.push(d);labels.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}))}const between=(d,a)=>{const x=new Date(d),b=new Date(a);b.setDate(b.getDate()+7);return x>=a&&x<b};charts.push(new Chart($('trend'),{type:'line',data:{labels,datasets:[{label:'Reqs Added',data:weeks.map(w=>reqs.filter(r=>reqDate(r)&&between(reqDate(r),w)).length),borderColor:'#2563eb',tension:.25},{label:'Submissions',data:weeks.map(w=>subs.filter(s=>subDate(s)&&between(subDate(s),w)).length),borderColor:'#7c3aed',tension:.25},{label:'Placements',data:weeks.map(w=>subs.filter(s=>s.stage==='placed'&&between(subDate(s),w)).length),borderColor:'#16a34a',tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}}))}
function drawReqs(){
 setTop('Requisitions','+ Add Req',()=>openReqModal());const list=reqs.filter(r=>r.role!=='— placeholder —').sort((a,b)=>(a.client||'').localeCompare(b.client||'')||(a.role||'').localeCompare(b.role||''));
 $('content').innerHTML=`<div class="card"><div class="section">All Requisitions</div><div class="small" style="margin-bottom:8px">Click any requisition to edit all details and the full job description.</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Client</th><th>Position</th><th>Status</th><th>Recruiter</th><th>Clearance</th><th>Seats</th><th>Subs</th><th>In Play</th><th>Added</th></tr></thead><tbody>${list.map(r=>{const ss=reqSubs(r),ip=ss.filter(s=>!['pass','declined','placed'].includes(s.stage)).length;return`<tr class="clickable" data-req="${r.id}"><td><b>${esc(r.client)}</b></td><td>${esc(r.role)}</td><td>${esc(r.status)}</td><td>${esc(r.recruiter||'—')}</td><td>${esc(r.clearance||'—')}</td><td>${+r.seats||1}</td><td>${ss.length}</td><td>${ip}</td><td>${fmt(reqDate(r))}</td></tr>`}).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-req]').forEach(x=>x.onclick=()=>openReqModal(x.dataset.req));

 setTop('Candidate Board','+ Add Submission',()=>openSubModal());const active=subs.filter(s=>s.stage!=='declined');$('content').innerHTML=`<div class="boardlegend"><div class="small">Drag cards between stages. Click a card to edit candidate details, notes, and resume.</div><button class="btn" id="archBtn">View Declined (${subs.filter(s=>s.stage==='declined').length})</button></div><div class="boardwrap"><div class="board">${BOARD_STAGES.map(([id,label])=>{const cards=active.filter(s=>s.stage===id);return`<section class="col"><div class="colhead"><span>${esc(label)}</span><span class="colcount">${cards.length}</span></div><div class="dropzone" data-stage="${id}">${cards.length?cards.map(cardHTML).join(''):`<div class="empty">Drop candidates here</div>`}</div></section>`}).join('')}</div></div>`;$('archBtn').onclick=showArchived;wireBoard();
}
function wireBoard(){document.querySelectorAll('.cand').forEach(c=>{c.addEventListener('mousedown',()=>dragged=false);c.addEventListener('mousemove',()=>dragged=true);c.addEventListener('click',()=>{if(!dragged)openSubModal(c.dataset.id)});c.addEventListener('dragstart',e=>{dragId=c.dataset.id;dragged=true;c.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId)});c.addEventListener('dragend',()=>{c.classList.remove('dragging');document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('over'))})});document.querySelectorAll('.dropzone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',async e=>{e.preventDefault();z.classList.remove('over');const id=dragId||e.dataTransfer.getData('text/plain');if(id)await changeStage(id,z.dataset.stage);dragId=null})})}
function showArchived(){const list=subs.filter(s=>s.stage==='declined');$('content').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between"><div class="section">Declined / Archived Candidates</div><button class="btn" id="backBoard">Back to Board</button></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Candidate</th><th>Client</th><th>Position</th><th>Recruiter</th><th>Date</th></tr></thead><tbody>${list.map(s=>`<tr class="clickable" data-sub="${s.id}"><td><b>${esc(s.name)}</b></td><td>${esc(s.client)}</td><td>${esc(s.role||'—')}</td><td>${esc(s.recruiter||'—')}</td><td>${fmt(subDate(s))}</td></tr>`).join('')}</tbody></table></div></div>`;$('backBoard').onclick=drawPipeline;document.querySelectorAll('[data-sub]').forEach(x=>x.onclick=()=>openSubModal(x.dataset.sub));}
function drawJDs(){
 setTop('Job Descriptions','+ Add Req',()=>openReqModal());const list=reqs.filter(r=>r.role!=='— placeholder —').sort((a,b)=>{const rank={priority:0,active:1,hold:2};return(rank[a.status]??9)-(rank[b.status]??9)||(a.client||'').localeCompare(b.client||'')||(a.role||'').localeCompare(b.role||'')});const clients=[...new Set(list.map(r=>r.client).filter(Boolean))];
 $('content').innerHTML=`<div class="card" style="margin-bottom:12px"><div class="section">Job Descriptions</div><div class="small">${list.length} total requisitions · priority/active requisitions first, then grouped alphabetically by client. Click any job to open the full description.</div></div>${clients.map(c=>{const cr=list.filter(r=>r.client===c);return`<div class="jdgroup"><div class="jdhead"><b>${esc(c)}</b><span class="pill blue">${cr.length} requisition${cr.length===1?'':'s'}</span></div>${cr.map(r=>`<div class="jdcard" data-jdreq="${r.id}"><div class="jdrole">${esc(r.role)}</div><div class="jdmeta">${esc(r.status)}${r.reqid?' · Req '+esc(r.reqid):''}${r.location?' · '+esc(r.location):''}${r.clearance?' · '+esc(r.clearance):''}</div><div class="jdmeta">${jdBodyForReq(r)?'Full job description on file':r.jd?'External job description link on file':'No full job description saved yet'}</div></div>`).join('')}</div>`}).join('')}`;document.querySelectorAll('[data-jdreq]').forEach(x=>x.onclick=()=>openJD(x.dataset.jdreq));
}
function openJD(id){const r=reqs.find(x=>String(x.id)===String(id));if(!r)return;const body=jdBodyForReq(r);$('jdTitle').textContent=r.role;$('jdDetail').innerHTML=`<div class="small" style="margin-bottom:10px"><b>${esc(r.client)}</b>${r.reqid?' · Req '+esc(r.reqid):''}${r.location?' · '+esc(r.location):''}${r.salary?' · '+esc(r.salary):''}${r.clearance?' · '+esc(r.clearance):''}</div>${r.jd?`<div style="margin-bottom:10px"><a href="${esc(r.jd)}" target="_blank" rel="noopener">Open external job description ↗</a></div>`:''}<div class="jdtext">${body?esc(body):'No written job description has been saved for this requisition yet.'}</div>`;$('jdEditBtn').onclick=()=>{closeModal('jdModal');openReqModal(id)};$('jdModal').classList.add('open')}
function clientStats(){return[...new Set([...reqs.map(r=>r.client),...subs.map(s=>s.client)].filter(Boolean))].map(c=>{const cr=reqs.filter(r=>r.client===c&&r.role!=='— placeholder —'),cs=subs.filter(s=>s.client===c),iv=cs.filter(s=>['interview_pm','interview_client'].includes(s.stage)).length,pl=cs.filter(s=>s.stage==='placed').length;return{client:c,reqs:cr.length,subs:cs.length,interviews:iv,placements:pl}}).sort((a,b)=>b.placements-a.placements||b.subs-a.subs)}
function drawClients(){setTop('Client Performance','+ Add Req',()=>openReqModal());const d=clientStats();$('content').innerHTML=`<div class="card"><div class="section">Client ROI / Conversion</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Client</th><th>Reqs</th><th>Subs</th><th>Interviews</th><th>Placements</th><th>Sub→Int</th><th>Sub→Place</th></tr></thead><tbody>${d.map(x=>`<tr><td><b>${esc(x.client)}</b></td><td>${x.reqs}</td><td>${x.subs}</td><td>${x.interviews}</td><td>${x.placements}</td><td>${x.subs?Math.round(x.interviews/x.subs*100):0}%</td><td>${x.subs?Math.round(x.placements/x.subs*100):0}%</td></tr>`).join('')}</tbody></table></div></div>`}
function drawTeam(){setTop('Team Performance','+ Add Submission',()=>openSubModal());const d=RECRUITERS.map(r=>{const ss=subs.filter(s=>s.recruiter===r),iv=ss.filter(s=>['interview_pm','interview_client'].includes(s.stage)).length,pl=ss.filter(s=>s.stage==='placed').length;return{name:r,reqs:reqs.filter(q=>q.recruiter===r).length,subs:ss.length,interviews:iv,placements:pl}});$('content').innerHTML=`<div class="card"><div class="section">Recruiter Outcomes</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Recruiter</th><th>Assigned Reqs</th><th>Submissions</th><th>Interviews</th><th>Placements</th><th>Sub→Int</th><th>Sub→Place</th></tr></thead><tbody>${d.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.reqs}</td><td>${x.subs}</td><td>${x.interviews}</td><td>${x.placements}</td><td>${x.subs?Math.round(x.interviews/x.subs*100):0}%</td><td>${x.subs?Math.round(x.placements/x.subs*100):0}%</td></tr>`).join('')}</tbody></table></div></div>`}
function fillClientSelect(selected){const clients=[...new Set(reqs.map(r=>r.client).filter(Boolean))].sort();$('s_client').innerHTML=clients.map(c=>`<option value="${esc(c)}"${c===selected?' selected':''}>${esc(c)}</option>`).join('')}
function fillReqSelect(selected){const c=$('s_client').value;$('s_req').innerHTML=reqs.filter(r=>r.client===c&&r.role!=='— placeholder —').map(r=>`<option value="${r.id}"${String(r.id)===String(selected)?' selected':''}>${esc(r.role)}${r.reqid?' · '+esc(r.reqid):''}</option>`).join('')}
function openReqModal(id=null){editReqId=id;const r=id?reqs.find(x=>String(x.id)===String(id)):null;$('reqTitle').textContent=r?'Edit Requisition':'Add Requisition';$('rq_client').value=r?.client||'';$('rq_status').value=r?.status||'active';$('rq_role').value=r?.role||'';$('rq_reqid').value=r?.reqid||'';$('rq_seats').value=r?.seats||1;$('rq_recruiter').value=r?.recruiter||'Peter';$('rq_clearance').value=r?.clearance||'';$('rq_location').value=r?.location||'';$('rq_salary').value=r?.salary||'';$('rq_jd').value=r?.jd||'';$('rq_jdbody').value=r?jdBodyForReq(r):'';$('rq_notes').value=r?.notes||'';$('deleteReqBtn').style.display=r?'inline-block':'none';$('reqModal').classList.add('open')}
function openSubModal(id=null){editSubId=id;const s=id?subs.find(x=>String(x.id)===String(id)):null;$('subTitle').textContent=s?'Edit Candidate':'Add Candidate Submission';fillClientSelect(s?.client);fillReqSelect(s?.req_id);$('s_client').onchange=()=>fillReqSelect(null);$('s_name').value=s?.name||'';$('s_recruiter').value=s?.recruiter||'Peter';$('s_stage').innerHTML=STAGES.map(x=>`<option value="${x[0]}"${x[0]===(s?.stage||'submitted')?' selected':''}>${x[1]}</option>`).join('');$('s_clearance').value=s?.clearance||'';$('s_date').value=s?.date||today();$('s_notes').value=s?.notes||'';$('s_resume').value=s?.resume_text||'';$('deleteSubBtn').style.display=s?'inline-block':'none';$('subModal').classList.add('open')}
async function saveReq(){const obj={client:$('rq_client').value.trim(),role:$('rq_role').value.trim(),status:$('rq_status').value,seats:+$('rq_seats').value||1,reqid:$('rq_reqid').value.trim(),recruiter:$('rq_recruiter').value,clearance:$('rq_clearance').value.trim(),location:$('rq_location').value.trim(),salary:$('rq_salary').value.trim(),jd:$('rq_jd').value.trim(),notes:$('rq_notes').value.trim()};if(!obj.client||!obj.role)return alert('Client and position are required.');let rid=editReqId;if(editReqId){const{error}=await sb.from('reqs').update(obj).eq('id',editReqId);if(error)return alert(error.message)}else{const{data,error}=await sb.from('reqs').insert(obj).select();if(error)return alert(error.message);rid=data?.[0]?.id}const body=$('rq_jdbody').value.trim();if(body){const existing=editReqId?jdForReq(reqs.find(x=>String(x.id)===String(editReqId))||obj):null;const jdObj={company:obj.client,role:obj.role,clearance:obj.clearance,salary:obj.salary,url:obj.jd,body};if(existing?.id)await sb.from('job_descriptions').update(jdObj).eq('id',existing.id);else await sb.from('job_descriptions').insert(jdObj)}closeModal('reqModal');await load()}
async function saveSub(){const rid=$('s_req').value,r=reqs.find(x=>String(x.id)===String(rid));const obj={name:$('s_name').value.trim(),client:$('s_client').value,role:r?.role||'',req_id:rid||null,stage:$('s_stage').value,recruiter:$('s_recruiter').value,clearance:$('s_clearance').value.trim()||r?.clearance||'',salary:r?.salary||'',date:$('s_date').value,notes:$('s_notes').value.trim(),resume_text:$('s_resume').value.trim()};if(!obj.name)return alert('Candidate name is required.');if(editSubId){const old=subs.find(x=>String(x.id)===String(editSubId));const{error}=await sb.from('submissions').update(obj).eq('id',editSubId);if(error)return alert(error.message);if(old&&old.stage!==obj.stage)await logStage(editSubId,old.stage,obj.stage)}else{const{data,error}=await sb.from('submissions').insert(obj).select();if(error)return alert(error.message);if(data?.[0])await logStage(data[0].id,'',obj.stage)}closeModal('subModal');await load()}
async function logStage(id,from,to){await sb.from('candidate_notes').insert({submission_id:id,note:`STAGE_EVENT|${from||''}|${to}|${new Date().toISOString()}`,author:'System'})}
async function changeStage(id,to){const s=subs.find(x=>String(x.id)===String(id));if(!s||s.stage===to)return;const from=s.stage;const{error}=await sb.from('submissions').update({stage:to}).eq('id',id);if(error)return alert(error.message);await logStage(id,from,to);await load()}
async function deleteReq(){if(!editReqId||!confirm('Delete this requisition?'))return;const{error}=await sb.from('reqs').delete().eq('id',editReqId);if(error)return alert(error.message);closeModal('reqModal');await load()}
async function deleteSub(){if(!editSubId||!confirm('Delete this candidate submission?'))return;const{error}=await sb.from('submissions').delete().eq('id',editSubId);if(error)return alert(error.message);closeModal('subModal');await load()}
function setPage(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setPage(n.dataset.page));$('range').onchange=render;$('refresh').onclick=load;$('saveReqBtn').onclick=saveReq;$('saveSubBtn').onclick=saveSub;$('deleteReqBtn').onclick=deleteReq;$('deleteSubBtn').onclick=deleteSub;document.querySelectorAll('.modalbg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));load();
</script>
</body>
