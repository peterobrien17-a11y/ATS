.boardwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:10px}.board{display:flex;gap:12px;min-width:max-content;align-items:flex-start}.col{width:260px;min-width:260px;background:#eef1f5;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb}.colhead{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;background:#fff;border-bottom:1px solid #e5e7eb}.colcount{font-size:10px;color:#6b7280;background:#f3f4f6;border-radius:999px;padding:2px 7px}.dropzone{min-height:520px;max-height:calc(100vh - 190px);overflow-y:auto;padding:8px;transition:.12s}.dropzone.over{background:#dbeafe;outline:2px dashed #60a5fa;outline-offset:-5px}.cand{background:#fff;border:1px solid #dfe3e8;border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}.cand:hover{border-color:#9ca3af;transform:translateY(-1px)}.cand.dragging{opacity:.45}.candname{font-size:12px;font-weight:800;margin-bottom:3px}.candrole{font-size:11px;color:#374151;line-height:1.35;margin-bottom:7px}.candmeta{font-size:10px;color:#6b7280;display:flex;justify-content:space-between;gap:6px;margin-top:4px}.companytag{display:inline-block;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;background:#eef2ff;color:#3730a3;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.boardlegend{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.boardlegend .small{margin-right:auto}.empty{text-align:center;color:#9ca3af;font-size:11px;padding:20px 4px}

<script>
const SB_URL='https://fjojakpqjoxleaegstvj.supabase.co',SB_KEY='sb_publishable_uk0JRuc9cLm3NqQZMBjYFA_9QgbuVOg';const sb=supabase.createClient(SB_URL,SB_KEY);
const STAGES=[['submitted','Submitted'],['screening','Screening'],['interview_pm','Interview – PM'],['interview_client','Interview – Prime'],['offer','Offer'],['offer_signed','Offer Signed'],['placed','Placed'],['pass','Pass'],['declined','Declined']];const BOARD_STAGES=STAGES.filter(x=>x[0]!=='declined');const RECRUITERS=['Peter','Melizza','Nisha','Jessi'];let reqs=[],subs=[],events=[],page='dashboard',charts=[],dragId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const fmt=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';const today=()=>new Date().toISOString().slice(0,10);function stageLabel(id){return(STAGES.find(x=>x[0]===id)||[id,id])[1]}function pill(stage){const c=stage==='placed'||stage==='offer_signed'?'green':stage==='offer'?'amber':stage?.startsWith('interview')?'purple':stage==='pass'||stage==='declined'?'gray':'blue';return`<span class="pill ${c}">${esc(stageLabel(stage))}</span>`}function closeModal(id){$(id).classList.remove('open')}function killCharts(){charts.forEach(c=>{try{c.destroy()}catch{}});charts=[]}function startForRange(){const now=new Date(),v=$('range').value;let d=new Date(now);if(v==='all')return null;if(v==='week'){const day=(now.getDay()+6)%7;d.setDate(now.getDate()-day);d.setHours(0,0,0,0)}else if(v==='month')d=new Date(now.getFullYear(),now.getMonth(),1);else if(v==='30'){d.setDate(now.getDate()-29);d.setHours(0,0,0,0)}else if(v==='quarter')d=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1);else if(v==='ytd')d=new Date(now.getFullYear(),0,1);return d}function inRange(d){if(!d)return false;const st=startForRange();return!st||new Date(d)>=st}function subDate(s){return s.date||s.created_at}function reqDate(r){return r.created_at||r.date_added||null}function currentOrEventCount(stage){const ev=new Set(events.filter(e=>e.to===stage&&inRange(e.at)).map(e=>String(e.submission_id)));subs.filter(s=>s.stage===stage&&inRange(subDate(s))).forEach(s=>ev.add(String(s.id)));return ev.size}function interviewCount(){const ev=new Set(events.filter(e=>['interview_pm','interview_client'].includes(e.to)&&inRange(e.at)).map(e=>String(e.submission_id)));subs.filter(s=>['interview_pm','interview_client'].includes(s.stage)&&inRange(subDate(s))).forEach(s=>ev.add(String(s.id)));return ev.size}function submissionsInRange(){return subs.filter(s=>inRange(subDate(s)))}function activeReqs(){return reqs.filter(r=>r.status!=='hold'&&r.role!=='— placeholder —')}function reqSubs(r){return subs.filter(s=>String(s.req_id)===String(r.id)||(s.client===r.client&&s.role===r.role))}function lastActivity(r){const dates=reqSubs(r).map(subDate).filter(Boolean).map(d=>new Date(d).getTime());return dates.length?new Date(Math.max(...dates)):null}
async function load(){$('statusline').textContent='Syncing…';const[{data:r,error:er},{data:s,error:es},{data:n}]=await Promise.all([sb.from('reqs').select('*').order('id',{ascending:false}),sb.from('submissions').select('*').order('created_at',{ascending:false}),sb.from('candidate_notes').select('*').order('created_at',{ascending:false})]);if(er||es){$('content').innerHTML=`<div class="card"><b>Database error</b><div class="small">${esc((er||es).message)}</div></div>`;return}reqs=r||[];subs=s||[];events=(n||[]).map(x=>{const m=String(x.note||'').match(/^STAGE_EVENT\|([^|]*)\|([^|]*)\|(.+)$/);return m?{submission_id:x.submission_id,from:m[1],to:m[2],at:m[3]}:null}).filter(Boolean);$('statusline').textContent=`Connected · ${reqs.length} reqs · ${subs.length} submissions`;render()}
function render(){killCharts();if(page==='dashboard')drawDashboard();else if(page==='reqs')drawReqs();else if(page==='pipeline')drawPipeline();else if(page==='clients')drawClients();else if(page==='team')drawTeam()}
function drawDashboard(){$('pagetitle').textContent='Recruiting Dashboard';$('addbtn').textContent='+ Add Req';$('addbtn').onclick=openReqModal;const rs=reqs.filter(r=>r.role!=='— placeholder —'&&inRange(reqDate(r))),ss=submissionsInRange(),iv=interviewCount(),of=currentOrEventCount('offer'),os=currentOrEventCount('offer_signed'),pl=currentOrEventCount('placed'),ar=activeReqs(),seats=ar.reduce((a,r)=>a+(+r.seats||1),0),funnel=[['Submitted',ss.length],['Interview',iv],['Offer',of],['Signed',os],['Placed',pl]],attention=ar.map(r=>{const list=reqSubs(r),last=lastActivity(r),days=last?Math.floor((Date.now()-last.getTime())/86400000):999;let sev='',msg='';if(!list.length){sev='redb';msg='No submissions'}else if(days>=7)msg=`No submission activity in ${days} days`;else if(!list.filter(s=>!['pass','declined','placed'].includes(s.stage)).length)msg='No candidates currently in play';return msg?{r,msg,sev}:null}).filter(Boolean).slice(0,8);$('content').innerHTML=`<div class="grid kpis"><div class="card"><div class="klabel">Positions Added</div><div class="kvalue">${rs.length}</div></div><div class="card"><div class="klabel">Candidates Submitted</div><div class="kvalue">${ss.length}</div></div><div class="card"><div class="klabel">Interviews</div><div class="kvalue">${iv}</div></div><div class="card"><div class="klabel">Signed Offers</div><div class="kvalue">${os}</div></div><div class="card"><div class="klabel">Placements</div><div class="kvalue">${pl}</div></div><div class="card"><div class="klabel">Active Reqs</div><div class="kvalue">${ar.length}</div></div><div class="card"><div class="klabel">Open Seats</div><div class="kvalue">${seats}</div></div><div class="card"><div class="klabel">Submit → Placement</div><div class="kvalue">${ss.length?Math.round(pl/ss.length*100):0}%</div></div></div><div class="card" style="margin-top:12px"><div class="section">Recruiting Funnel</div><div class="funnel">${funnel.map((x,i)=>`<div class="fstep"><div class="fnum">${x[1]}</div><div class="flbl">${x[0]}</div>${i?`<div class="small">${funnel[i-1][1]?Math.round(x[1]/funnel[i-1][1]*100):0}% from prior</div>`:''}</div>`).join('')}</div></div><div class="grid two"><div class="card"><div class="section">12-Week Activity Trend</div><div class="chartbox"><canvas id="trend"></canvas></div></div><div class="card"><div class="section">Needs Attention</div><div class="attention">${attention.length?attention.map(a=>`<div class="att ${a.sev}"><b>${esc(a.r.client)} — ${esc(a.r.role)}</b><div class="small">${esc(a.msg)}</div></div>`).join(''):'<div class="small">No urgent reqs flagged.</div>'}</div></div></div><div class="card" style="margin-top:12px"><div class="section">Client Performance</div>${clientTable()}</div>`;drawTrend()}
function weekStart(d){const x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}function drawTrend(){const labels=[],weeks=[];let cur=weekStart(new Date());for(let i=11;i>=0;i--){const d=new Date(cur);d.setDate(cur.getDate()-i*7);weeks.push(d);labels.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}))}const between=(d,a)=>{const x=new Date(d),b=new Date(a);b.setDate(b.getDate()+7);return x>=a&&x<b},data={reqs:weeks.map(w=>reqs.filter(r=>reqDate(r)&&between(reqDate(r),w)).length),subs:weeks.map(w=>subs.filter(s=>subDate(s)&&between(subDate(s),w)).length),placed:weeks.map(w=>{const set=new Set(events.filter(e=>e.to==='placed'&&between(e.at,w)).map(e=>String(e.submission_id)));subs.filter(s=>s.stage==='placed'&&between(subDate(s),w)).forEach(s=>set.add(String(s.id)));return set.size})};charts.push(new Chart($('trend'),{type:'line',data:{labels,datasets:[{label:'Reqs Added',data:data.reqs,borderColor:'#2563eb',tension:.25},{label:'Submissions',data:data.subs,borderColor:'#7c3aed',tension:.25},{label:'Placements',data:data.placed,borderColor:'#16a34a',tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}}))}
function drawReqs(){$('pagetitle').textContent='Requisitions';$('addbtn').textContent='+ Add Req';$('addbtn').onclick=openReqModal;const list=reqs.filter(r=>r.role!=='— placeholder —');$('content').innerHTML=`<div class="card"><div class="section">All Requisitions</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Client</th><th>Position</th><th>Status</th><th>Recruiter</th><th>Clearance</th><th>Seats</th><th>Subs</th><th>In Play</th><th>Added</th></tr></thead><tbody>${list.map(r=>{const ss=reqSubs(r),ip=ss.filter(s=>!['pass','declined','placed'].includes(s.stage)).length;return`<tr><td><b>${esc(r.client)}</b></td><td>${esc(r.role)}</td><td>${esc(r.status)}</td><td>${esc(r.recruiter||'—')}</td><td>${esc(r.clearance||'—')}</td><td>${+r.seats||1}</td><td>${ss.length}</td><td>${ip}</td><td>${fmt(reqDate(r))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function cardHTML(s){return`<div class="cand" draggable="true" data-id="${s.id}"><div class="candname">${esc(s.name)}</div><div class="candrole">${esc(s.role||'No position linked')}</div><span class="companytag">${esc(s.client||'No client')}</span><div class="candmeta"><span>${esc(s.recruiter||'Unassigned')}</span><span>${fmt(subDate(s))}</span></div>${s.clearance?`<div class="candmeta"><span>${esc(s.clearance)}</span></div>`:''}</div>`}
function drawPipeline(){$('pagetitle').textContent='Candidate Board';$('addbtn').textContent='+ Add Submission';$('addbtn').onclick=openSubModal;const active=subs.filter(s=>s.stage!=='declined');$('content').innerHTML=`<div class="boardlegend"><div class="small">Drag a candidate card to a new stage. The move saves to Supabase and is added to reporting history.</div><button class="btn" onclick="showArchived()">View Declined (${subs.filter(s=>s.stage==='declined').length})</button></div><div class="boardwrap"><div class="board">${BOARD_STAGES.map(([id,label])=>{const cards=active.filter(s=>s.stage===id);return`<section class="col"><div class="colhead"><span>${esc(label)}</span><span class="colcount">${cards.length}</span></div><div class="dropzone" data-stage="${id}">${cards.length?cards.map(cardHTML).join(''):`<div class="empty">Drop candidates here</div>`}</div></section>`}).join('')}</div></div>`;wireBoard()}
function wireBoard(){document.querySelectorAll('.cand').forEach(c=>{c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});c.addEventListener('dragend',()=>{c.classList.remove('dragging');document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('over'))})});document.querySelectorAll('.dropzone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',async e=>{e.preventDefault();z.classList.remove('over');const id=dragId||e.dataTransfer.getData('text/plain'),to=z.dataset.stage;if(id&&to)await changeStage(id,to);dragId=null})})}
function showArchived(){const list=subs.filter(s=>s.stage==='declined');$('content').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="section" style="margin:0">Declined / Archived Candidates</div><button class="btn" onclick="drawPipeline()">Back to Board</button></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Candidate</th><th>Client</th><th>Position</th><th>Recruiter</th><th>Date</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.client)}</td><td>${esc(s.role||'—')}</td><td>${esc(s.recruiter||'—')}</td><td>${fmt(subDate(s))}</td><td><select class="fi" onchange="changeStage('${s.id}',this.value)">${STAGES.map(x=>`<option value="${x[0]}" ${x[0]===s.stage?'selected':''}>${x[1]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function clientStats(){return[...new Set([...reqs.map(r=>r.client),...subs.map(s=>s.client)].filter(Boolean))].map(c=>{const cr=reqs.filter(r=>r.client===c&&r.role!=='— placeholder —'),cs=subs.filter(s=>s.client===c),ivs=new Set(),ofs=new Set(),oss=new Set(),pls=new Set(),ids=new Set(cs.map(s=>String(s.id)));cs.forEach(s=>{if(['interview_pm','interview_client'].includes(s.stage))ivs.add(String(s.id));if(s.stage==='offer')ofs.add(String(s.id));if(s.stage==='offer_signed')oss.add(String(s.id));if(s.stage==='placed')pls.add(String(s.id))});events.filter(e=>ids.has(String(e.submission_id))).forEach(e=>{if(['interview_pm','interview_client'].includes(e.to))ivs.add(String(e.submission_id));if(e.to==='offer')ofs.add(String(e.submission_id));if(e.to==='offer_signed')oss.add(String(e.submission_id));if(e.to==='placed')pls.add(String(e.submission_id))});return{client:c,reqs:cr.length,subs:cs.length,interviews:ivs.size,offers:ofs.size,signed:oss.size,placements:pls.size}}).sort((a,b)=>b.placements-a.placements||b.interviews-a.interviews||b.subs-a.subs)}function clientTable(){const d=clientStats();return`<div class="tablewrap"><table class="tbl"><thead><tr><th>Client</th><th>Reqs</th><th>Subs</th><th>Interviews</th><th>Offers</th><th>Signed</th><th>Placements</th><th>Sub→Int</th><th>Sub→Place</th></tr></thead><tbody>${d.map(x=>`<tr><td><b>${esc(x.client)}</b></td><td>${x.reqs}</td><td>${x.subs}</td><td>${x.interviews}</td><td>${x.offers}</td><td>${x.signed}</td><td>${x.placements}</td><td>${x.subs?Math.round(x.interviews/x.subs*100):0}%</td><td>${x.subs?Math.round(x.placements/x.subs*100):0}%</td></tr>`).join('')}</tbody></table></div>`}function drawClients(){$('pagetitle').textContent='Client Performance';$('addbtn').textContent='+ Add Req';$('addbtn').onclick=openReqModal;$('content').innerHTML=`<div class="card"><div class="section">Client ROI / Conversion</div>${clientTable()}</div>`}
function drawTeam(){$('pagetitle').textContent='Team Performance';$('addbtn').textContent='+ Add Submission';$('addbtn').onclick=openSubModal;const d=RECRUITERS.map(r=>{const ss=subs.filter(s=>s.recruiter===r),ids=new Set(ss.map(s=>String(s.id))),ivs=new Set(),ofs=new Set(),oss=new Set(),pls=new Set();ss.forEach(s=>{if(['interview_pm','interview_client'].includes(s.stage))ivs.add(String(s.id));if(s.stage==='offer')ofs.add(String(s.id));if(s.stage==='offer_signed')oss.add(String(s.id));if(s.stage==='placed')pls.add(String(s.id))});events.filter(e=>ids.has(String(e.submission_id))).forEach(e=>{if(['interview_pm','interview_client'].includes(e.to))ivs.add(String(e.submission_id));if(e.to==='offer')ofs.add(String(e.submission_id));if(e.to==='offer_signed')oss.add(String(e.submission_id));if(e.to==='placed')pls.add(String(e.submission_id))});return{name:r,subs:ss.length,interviews:ivs.size,offers:ofs.size,signed:oss.size,placements:pls.size,reqs:reqs.filter(q=>q.recruiter===r).length}});$('content').innerHTML=`<div class="card"><div class="section">Recruiter Outcomes</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Recruiter</th><th>Assigned Reqs</th><th>Submissions</th><th>Interviews</th><th>Offers</th><th>Signed</th><th>Placements</th><th>Sub→Int</th><th>Sub→Place</th></tr></thead><tbody>${d.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.reqs}</td><td>${x.subs}</td><td>${x.interviews}</td><td>${x.offers}</td><td>${x.signed}</td><td>${x.placements}</td><td>${x.subs?Math.round(x.interviews/x.subs*100):0}%</td><td>${x.subs?Math.round(x.placements/x.subs*100):0}%</td></tr>`).join('')}</tbody></table></div></div>`}
function openReqModal(){$('reqModal').classList.add('open')}function openSubModal(){const clients=[...new Set(reqs.map(r=>r.client).filter(Boolean))].sort();$('s_client').innerHTML=clients.map(c=>`<option>${esc(c)}</option>`).join('');$('s_stage').innerHTML=STAGES.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('s_date').value=today();fillReqs();$('subModal').classList.add('open')}function fillReqs(){const c=$('s_client').value;$('s_req').innerHTML=reqs.filter(r=>r.client===c&&r.role!=='— placeholder —').map(r=>`<option value="${r.id}">${esc(r.role)}${r.reqid?' · '+esc(r.reqid):''}</option>`).join('')}
async function saveReq(){const obj={client:$('rq_client').value.trim(),role:$('rq_role').value.trim(),status:$('rq_status').value,seats:+$('rq_seats').value||1,reqid:$('rq_reqid').value.trim(),recruiter:$('rq_recruiter').value,clearance:$('rq_clearance').value.trim(),location:$('rq_location').value.trim(),salary:$('rq_salary').value.trim(),jd:$('rq_jd').value.trim(),notes:$('rq_notes').value.trim()};if(!obj.client||!obj.role)return alert('Client and position are required.');const{error}=await sb.from('reqs').insert(obj);if(error)return alert(error.message);closeModal('reqModal');await load()}async function saveSub(){const rid=$('s_req').value,r=reqs.find(x=>String(x.id)===String(rid)),obj={name:$('s_name').value.trim(),client:$('s_client').value,role:r?.role||'',req_id:rid||null,stage:$('s_stage').value,recruiter:$('s_recruiter').value,clearance:$('s_clearance').value.trim()||r?.clearance||'',salary:r?.salary||'',date:$('s_date').value,notes:$('s_notes').value.trim(),resume_text:''};if(!obj.name)return alert('Candidate name is required.');const{data,error}=await sb.from('submissions').insert(obj).select();if(error)return alert(error.message);if(data?.[0])await logStage(data[0].id,'',obj.stage);closeModal('subModal');await load()}async function logStage(id,from,to){await sb.from('candidate_notes').insert({submission_id:id,note:`STAGE_EVENT|${from||''}|${to}|${new Date().toISOString()}`,author:'System'})}async function changeStage(id,to){const s=subs.find(x=>String(x.id)===String(id));if(!s||s.stage===to)return;const from=s.stage;s.stage=to;render();const{error}=await sb.from('submissions').update({stage:to}).eq('id',id);if(error){s.stage=from;render();return alert(error.message)}await logStage(id,from,to);await load()}
function setPage(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setPage(n.dataset.page));$('range').onchange=render;$('refresh').onclick=load;$('addbtn').onclick=openReqModal;load();
</script></body></html>
